[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "web3-assistant"
version = "0.1.0"
description = "Personal Web3 AI assistant (Telegram)"
requires-python = ">=3.11"
dependencies = [
    "pydantic-settings>=2.2",
    "python-telegram-bot>=22.7,<23",
    "sqlalchemy>=2.0,<3",
    "tzdata>=2024.1",
    "httpx>=0.27",
]

[project.optional-dependencies]
# Only needed when switching to PostgreSQL (for example Supabase):
postgres = ["psycopg[binary]>=3.1"]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
